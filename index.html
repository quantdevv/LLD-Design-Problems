<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LLD Mastery — 26 Problems</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/app.css"/>
</head>
<body>

<!-- Top bar -->
<nav class="topbar">
  <a class="brand" href="#" onclick="App.goHome();return false;">
    <span class="brand-mark">L</span>
    <span>LLD Mastery</span>
    <span class="brand-sub">26-problem interview reference</span>
  </a>
  <div class="tb-spacer"></div>
  <div class="tb-controls">
    <div class="search" onclick="App.openCmdK()">
      <span class="search-icon">⌕</span>
      <input id="topSearch" placeholder="Search problems…" readonly/>
      <span class="search-kbd">⌘K</span>
    </div>
    <button class="tb-btn" id="themeToggle" title="Toggle theme">
      <span id="themeIcon">◐</span>
      <span class="kbd">T</span>
    </button>
    <button class="tb-btn" onclick="window.print()" title="Print / save PDF">
      Print
    </button>
  </div>
</nav>
<div class="progress-bar" id="progressBar"></div>

<!-- Layout -->
<div class="layout">
  <!-- Left rail: problem index -->
  <aside class="rail-left" id="railLeft">
    <div class="rail-title">All Problems</div>
    <div id="railContent">
      <div class="loading"><div class="spinner"></div><div>Loading…</div></div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main" id="main">
    <div class="loading"><div class="spinner"></div><div>Loading problem…</div></div>
  </main>

  <!-- Right rail: in-page TOC + studied + nav -->
  <aside class="rail-right" id="railRight">
    <div class="toc-title">On this page</div>
    <ul class="toc-list" id="tocList"></ul>
    <div class="toc-meta">
      <div class="toc-meta-tag">Status</div>
      <button class="studied-toggle" id="studiedBtn">
        <span class="check"></span>
        <span id="studiedLabel">Mark as studied</span>
      </button>
      <div class="nav-strip">
        <button class="nav-arrow" id="prevBtn" onclick="App.prev()">
          <span class="nav-arrow-tag">← Prev</span>
          <span class="nav-arrow-text" id="prevText">—</span>
        </button>
        <button class="nav-arrow" id="nextBtn" onclick="App.next()">
          <span class="nav-arrow-tag">Next →</span>
          <span class="nav-arrow-text" id="nextText">—</span>
        </button>
      </div>
    </div>
  </aside>
</div>

<!-- Command palette overlay -->
<div class="cmdk-overlay" id="cmdkOverlay" onclick="if(event.target===this) App.closeCmdK()">
  <div class="cmdk-panel">
    <div class="cmdk-input-wrap">
      <span class="search-icon" style="position:relative;left:0;top:0;transform:none;font-size:18px;color:var(--muted)">⌕</span>
      <input id="cmdkInput" placeholder="Jump to a problem… (try 'cache' or 'parking')"/>
      <kbd style="font-family:var(--font-mono);font-size:10px;background:var(--s3);border:1px solid var(--border);padding:2px 6px;border-radius:3px;color:var(--muted)">esc</kbd>
    </div>
    <div class="cmdk-results" id="cmdkResults"></div>
    <div class="cmdk-foot">
      <span><kbd>↑↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<script src="js/highlight.js"></script>
<script src="js/render.js"></script>
<script>
// ═══════════════════════════════════════════════════
// LLD Mastery — App shell
// ═══════════════════════════════════════════════════
const MANIFEST = [
  {file:"topics/p01_parking_lot.json",       group:"State Machine / Creational"},
  {file:"topics/p02_elevator.json",          group:"State Machine / Creational"},
  {file:"topics/p03_amazon_locker.json",     group:"State Machine / Creational"},
  {file:"topics/p04_vending_machine.json",   group:"State Machine / Creational"},
  {file:"topics/p05_atm.json",               group:"State Machine / Creational"},
  {file:"topics/p06_rate_limiter.json",      group:"Concurrency Heavy"},
  {file:"topics/p07_task_scheduler.json",    group:"Concurrency Heavy"},
  {file:"topics/p08_blocking_queue.json",    group:"Concurrency Heavy"},
  {file:"topics/p09_pubsub.json",            group:"Concurrency Heavy"},
  {file:"topics/p10_connection_pool.json",   group:"Concurrency Heavy"},
  {file:"topics/p11_chess.json",             group:"Game / Logic"},
  {file:"topics/p12_splitwise.json",         group:"Game / Logic"},
  {file:"topics/p13_movie_ticket.json",      group:"Game / Logic"},
  {file:"topics/p14_library.json",           group:"Game / Logic"},
  {file:"topics/p15_food_delivery.json",     group:"Game / Logic"},
  {file:"topics/p16_file_system.json",       group:"Mixed Archetypes"},
  {file:"topics/p17_notification.json",      group:"Mixed Archetypes"},
  {file:"topics/p18_lru_cache.json",         group:"Mixed Archetypes"},
  {file:"topics/p19_hotel_booking.json",     group:"Mixed Archetypes"},
  {file:"topics/p20_tictactoe.json",         group:"Mixed Archetypes"},
  {file:"topics/p21_collab_doc.json",        group:"System-Style LLD"},
  {file:"topics/p22_leetcode.json",          group:"System-Style LLD"},
  {file:"topics/p23_url_shortener.json",     group:"System-Style LLD"},
  {file:"topics/p24_stackoverflow.json",     group:"System-Style LLD"},
  {file:"topics/p25_cricket.json",           group:"System-Style LLD"},
  {file:"topics/p26_collab_editor_session.json", group:"System-Style LLD"}
];

const STORAGE_KEY = 'lld-mastery-v2';
const State = {
  problems: [],         // loaded JSONs (one per manifest entry)
  current: 0,           // current problem index
  studied: new Set(),   // ids of studied problems
  loaded: new Set(),    // indices loaded
  cmdkActive: 0,        // active result idx
  cmdkResults: [],      // current result list
};

function loadStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    if (obj.studied) State.studied = new Set(obj.studied);
    if (obj.theme === 'light') document.body.classList.add('light-theme');
    if (typeof obj.current === 'number') State.current = obj.current;
  } catch (e) {}
}
function saveStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      studied: [...State.studied],
      theme: document.body.classList.contains('light-theme') ? 'light' : 'dark',
      current: State.current,
    }));
  } catch (e) {}
}

// ── Loading ───────────────────────────────────────────
async function fetchProblem(idx) {
  if (State.problems[idx]) return State.problems[idx];
  const m = MANIFEST[idx];
  try {
    const r = await fetch(m.file);
    if (!r.ok) throw new Error('http ' + r.status);
    const data = await r.json();
    State.problems[idx] = data;
    State.loaded.add(idx);
    return data;
  } catch (e) {
    const fallback = {
      _missing: true,
      title: m.file.replace(/.*\//,'').replace(/\.json$/,'').replace(/^p\d+_/,'').replace(/_/g,' '),
      description: `This problem is not yet available. Add **${m.file}** to load its content.`,
      tags: [],
    };
    State.problems[idx] = fallback;
    return fallback;
  }
}

async function fetchAllForIndex() {
  // Fetch only titles for index — use existing fetch (light), all are tiny
  // We just fetch all so search works. Sequential is fine for ~26 files locally.
  for (let i = 0; i < MANIFEST.length; i++) {
    if (!State.problems[i]) await fetchProblem(i);
  }
}

// ── Rail (left index) ─────────────────────────────────
function renderRail() {
  const el = document.getElementById('railContent');
  let html = '';
  let currentGroup = '';
  MANIFEST.forEach((m, i) => {
    if (m.group !== currentGroup) {
      if (currentGroup) html += '</div></div>';
      currentGroup = m.group;
      html += `<div class="rail-group">`;
      html += `<div class="rail-group-head" onclick="App.toggleGroup(this)">${LLDRender.esc(m.group)}<span class="chev">▾</span></div>`;
      html += `<div class="rail-items">`;
    }
    const p = State.problems[i];
    const num = String(i+1).padStart(2,'0');
    const title = p?.title || m.file.replace(/.*\//,'').replace(/\.json$/,'').replace(/^p\d+_/,'').replace(/_/g,' ');
    const studied = State.studied.has(i) ? 'studied' : '';
    const active = State.current === i ? 'active' : '';
    html += `<div class="rail-item ${active} ${studied}" onclick="App.go(${i})">`;
    html += `<span class="rail-num"><span>${num}</span></span>`;
    html += `<span class="rail-text">${LLDRender.esc(title)}</span>`;
    html += `</div>`;
  });
  if (currentGroup) html += '</div></div>';
  el.innerHTML = html;
}

function toggleGroup(headEl) {
  headEl.parentElement.classList.toggle('collapsed');
}

// ── Right rail TOC ────────────────────────────────────
function renderTOC(p) {
  const list = document.getElementById('tocList');
  if (!p || p._missing) { list.innerHTML = ''; return; }
  const sections = LLDRender.getSections(p);
  list.innerHTML = sections.map(s => `
    <li class="toc-item" data-toc="${s.id}">
      <a href="#${s.id}" onclick="App.scrollToSection('${s.id}');return false;">
        ${s.n ? `<span class="toc-num">${s.n}</span>` : '<span class="toc-num"></span>'}
        <span>${LLDRender.esc(s.label)}</span>
      </a>
    </li>
  `).join('');
}

// ── Studied + Nav ─────────────────────────────────────
function renderMeta() {
  const btn = document.getElementById('studiedBtn');
  const label = document.getElementById('studiedLabel');
  const isStudied = State.studied.has(State.current);
  btn.classList.toggle('on', isStudied);
  btn.querySelector('.check').textContent = isStudied ? '✓' : '';
  label.textContent = isStudied ? 'Studied' : 'Mark as studied';

  const prevText = document.getElementById('prevText');
  const nextText = document.getElementById('nextText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  if (State.current > 0) {
    const p = State.problems[State.current - 1];
    prevText.textContent = p?.title || '—';
    prevBtn.disabled = false;
  } else {
    prevText.textContent = '—';
    prevBtn.disabled = true;
  }
  if (State.current < MANIFEST.length - 1) {
    const p = State.problems[State.current + 1];
    nextText.textContent = p?.title || '—';
    nextBtn.disabled = false;
  } else {
    nextText.textContent = '—';
    nextBtn.disabled = true;
  }
}

// ── Render current problem ────────────────────────────
async function renderCurrent() {
  const main = document.getElementById('main');
  main.innerHTML = `<div class="loading"><div class="spinner"></div><div>Loading…</div></div>`;
  const p = await fetchProblem(State.current);
  main.innerHTML = `<div id="sec-top"></div>` + LLDRender.renderProblem(p, State.current);
  renderTOC(p);
  renderMeta();
  renderRail();
  attachCodeButtons();
  setupTOCObserver();
  // Scroll to top of content
  window.scrollTo({top: 0, behavior: 'instant'});
  saveStorage();
  // Update URL hash
  history.replaceState(null, '', `#p${State.current + 1}`);
  document.title = `${String(State.current+1).padStart(2,'0')} · ${p.title} — LLD Mastery`;
}

// ── Code copy/wrap buttons ────────────────────────────
function attachCodeButtons() {
  document.querySelectorAll('.code-wrapper').forEach(wrapper => {
    wrapper.querySelectorAll('.code-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const act = btn.dataset.act;
        if (act === 'wrap') {
          wrapper.classList.toggle('wrap');
          btn.textContent = wrapper.classList.contains('wrap') ? '⇄ Unwrap' : '⇄ Wrap';
        } else if (act === 'copy') {
          const lines = [...wrapper.querySelectorAll('.line-content')].map(s => s.innerText).join('\n');
          (navigator.clipboard ? navigator.clipboard.writeText(lines) : Promise.reject())
            .catch(() => {
              const ta = document.createElement('textarea');
              ta.value = lines;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
            }).finally(() => {
              btn.classList.add('copied');
              const orig = btn.textContent;
              btn.textContent = '✓ Copied';
              setTimeout(() => {
                btn.classList.remove('copied');
                btn.textContent = orig;
              }, 1600);
            });
        }
      });
    });
  });
}

// ── TOC active-section observer ───────────────────────
let _tocObs = null;
function setupTOCObserver() {
  if (_tocObs) _tocObs.disconnect();
  const sections = document.querySelectorAll('.sec');
  if (!sections.length) return;
  _tocObs = new IntersectionObserver(entries => {
    const visible = entries.filter(e => e.isIntersecting);
    if (!visible.length) return;
    const best = visible.reduce((m, e) => e.intersectionRatio > m.intersectionRatio ? e : m, visible[0]);
    document.querySelectorAll('.toc-item').forEach(t => t.classList.remove('active'));
    const id = best.target.id;
    const tocEl = document.querySelector(`.toc-item[data-toc="${id}"]`);
    if (tocEl) tocEl.classList.add('active');
  }, { rootMargin: '-15% 0px -65% 0px' });
  sections.forEach(s => _tocObs.observe(s));
}

// ── Top reading-progress bar ──────────────────────────
function setupProgress() {
  const bar = document.getElementById('progressBar');
  window.addEventListener('scroll', () => {
    const h = document.documentElement;
    const pct = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
    bar.style.width = Math.min(100, Math.max(0, pct)) + '%';
  }, { passive: true });
}

// ── Command palette ───────────────────────────────────
function openCmdK() {
  document.getElementById('cmdkOverlay').classList.add('open');
  const input = document.getElementById('cmdkInput');
  input.value = '';
  setTimeout(() => input.focus(), 30);
  cmdKSearch('');
}
function closeCmdK() {
  document.getElementById('cmdkOverlay').classList.remove('open');
}
function cmdKSearch(q) {
  q = (q || '').toLowerCase().trim();
  const results = [];
  MANIFEST.forEach((m, i) => {
    const p = State.problems[i];
    const title = p?.title || m.file.replace(/.*\//,'').replace(/\.json$/,'').replace(/^p\d+_/,'').replace(/_/g,' ');
    const desc = p?.description || '';
    const hay = (title + ' ' + desc + ' ' + m.group).toLowerCase();
    if (!q || hay.includes(q)) {
      results.push({ idx: i, title, group: m.group });
    }
  });
  State.cmdkResults = results;
  State.cmdkActive = 0;
  renderCmdKResults();
}
function renderCmdKResults() {
  const el = document.getElementById('cmdkResults');
  if (!State.cmdkResults.length) {
    el.innerHTML = `<div class="cmdk-empty">No matches.</div>`;
    return;
  }
  el.innerHTML = State.cmdkResults.map((r, i) => {
    const num = String(r.idx + 1).padStart(2,'0');
    const studied = State.studied.has(r.idx);
    return `<div class="cmdk-result ${i === State.cmdkActive ? 'active' : ''}"
                 data-idx="${r.idx}" data-listidx="${i}"
                 onclick="App.cmdKPick(${r.idx})">
      <span class="cmdk-result-num">${num}</span>
      <span class="cmdk-result-title">${LLDRender.esc(r.title)}${studied ? ' <span style=\"color:var(--green);font-size:11px\">✓</span>' : ''}</span>
      <span class="cmdk-result-group">${LLDRender.esc(r.group)}</span>
    </div>`;
  }).join('');
}
function cmdKMove(dir) {
  const n = State.cmdkResults.length;
  if (!n) return;
  State.cmdkActive = (State.cmdkActive + dir + n) % n;
  renderCmdKResults();
  const active = document.querySelector('.cmdk-result.active');
  if (active) active.scrollIntoView({block: 'nearest'});
}
function cmdKPick(idx) {
  closeCmdK();
  go(idx);
}

// ── Navigation ────────────────────────────────────────
function go(i) {
  if (i < 0 || i >= MANIFEST.length) return;
  State.current = i;
  renderCurrent();
}
function next() { go(State.current + 1); }
function prev() { go(State.current - 1); }
function goHome() { go(0); }
function scrollToSection(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
}
function toggleStudied() {
  if (State.studied.has(State.current)) State.studied.delete(State.current);
  else State.studied.add(State.current);
  renderMeta();
  renderRail();
  saveStorage();
}

// ── Theme ─────────────────────────────────────────────
function toggleTheme() {
  document.body.classList.toggle('light-theme');
  document.getElementById('themeIcon').textContent =
    document.body.classList.contains('light-theme') ? '◑' : '◐';
  saveStorage();
}

// ── Keyboard ──────────────────────────────────────────
function setupKeys() {
  document.addEventListener('keydown', e => {
    const cmdkOpen = document.getElementById('cmdkOverlay').classList.contains('open');
    const inField = ['INPUT','TEXTAREA'].includes(document.activeElement?.tagName);
    if (cmdkOpen) {
      if (e.key === 'Escape') { e.preventDefault(); closeCmdK(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); cmdKMove(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); cmdKMove(-1); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        const r = State.cmdkResults[State.cmdkActive];
        if (r) cmdKPick(r.idx);
      }
      return;
    }
    if (inField) return;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault(); openCmdK();
    } else if (e.key === '/') {
      e.preventDefault(); openCmdK();
    } else if (e.key === 'ArrowLeft' && (e.metaKey || e.altKey)) {
      e.preventDefault(); prev();
    } else if (e.key === 'ArrowRight' && (e.metaKey || e.altKey)) {
      e.preventDefault(); next();
    } else if (e.key === 't' || e.key === 'T') {
      toggleTheme();
    } else if (e.key === 's' || e.key === 'S') {
      toggleStudied();
    }
  });
  document.getElementById('cmdkInput').addEventListener('input', e => cmdKSearch(e.target.value));
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  document.getElementById('studiedBtn').addEventListener('click', toggleStudied);
}

// ── Boot ──────────────────────────────────────────────
async function boot() {
  loadStorage();
  // pull initial problem from URL hash if present
  const m = location.hash.match(/^#p(\d+)/);
  if (m) {
    const n = parseInt(m[1], 10) - 1;
    if (n >= 0 && n < MANIFEST.length) State.current = n;
  }
  document.getElementById('themeIcon').textContent =
    document.body.classList.contains('light-theme') ? '◑' : '◐';
  renderRail();   // skeleton with file names
  setupKeys();
  setupProgress();
  // Render current
  await renderCurrent();
  // Background-load all problems for search/index titles
  fetchAllForIndex().then(() => {
    renderRail();
    renderMeta();
  });
}

window.App = {
  go, next, prev, goHome,
  toggleGroup, scrollToSection,
  openCmdK, closeCmdK, cmdKPick,
  toggleStudied, toggleTheme,
};

boot();
</script>
</body>
</html>
